services:
  app:
    build: .
    container_name: nuoche-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-13004}:3000"
    volumes:
      - /volume2/docker/nuoche/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: nuoche_default
    ipam:
      config:
        - subnet: 10.66.0.0/24
